name: Update stats cards

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/stats.py"
      - ".github/scripts/highlights.py"
      - ".github/scripts/bust.py"
      - "highlights.json"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate highlights
        run: python .github/scripts/highlights.py
      - name: Generate cards
        run: python .github/scripts/stats.py assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Refresh image cache keys
        run: python .github/scripts/bust.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats.svg assets/langs.svg assets/streak.svg assets/highlights.svg
          git diff --cached --quiet || (git commit -m "Update stats cards" && git pull --rebase origin main && git push)
