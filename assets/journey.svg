<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 587" width="900" height="587" role="img" aria-label="How I got here: a timeline"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#151d2b"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="900" height="587" rx="16" fill="url(#bg)"/><rect x=".5" y=".5" width="899" height="586" rx="16" fill="none" stroke="#fff" stroke-opacity=".10"/><text x="40" y="52" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">How I got here</text><line x1="215" y1="104" x2="215" y2="536" stroke="#fff" stroke-opacity=".15" stroke-width="2"/><g opacity=".5"><animate attributeName="opacity" values=".5;.5;1;.5;.5" keyTimes="0;0.000;0.000;0.090;1" dur="9s" repeatCount="indefinite"/><text x="190" y="108" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12.5" fill="#ff4d5a">KG2</text><circle cx="215" cy="104" r="5.5" fill="#0b0f17" stroke="#ff4d5a" stroke-width="2"/><text x="245" y="100" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">First computer</text><text x="245" y="119" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b98a9">Got curious about PCs very early and never stopped poking.</text></g><g opacity=".5"><animate attributeName="opacity" values=".5;.5;1;.5;.5" keyTimes="0;0.035;0.125;0.215;1" dur="9s" repeatCount="indefinite"/><text x="190" y="162" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12.5" fill="#ff4d5a">Class 6</text><circle cx="215" cy="158" r="5.5" fill="#0b0f17" stroke="#ff4d5a" stroke-width="2"/><text x="245" y="154" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Learned to build a PC</text><text x="245" y="173" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b98a9">Low-spec office machine, with my father showing me the basics.</text></g><g opacity=".5"><animate attributeName="opacity" values=".5;.5;1;.5;.5" keyTimes="0;0.160;0.250;0.340;1" dur="9s" repeatCount="indefinite"/><text x="190" y="216" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12.5" fill="#ff4d5a">Class 7</text><circle cx="215" cy="212" r="5.5" fill="#0b0f17" stroke="#ff4d5a" stroke-width="2"/><text x="245" y="208" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">OS tinkering</text><text x="245" y="227" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b98a9">Installing OSes, making bootable USBs, chasing Android games on PC.</text></g><g opacity=".5"><animate attributeName="opacity" values=".5;.5;1;.5;.5" keyTimes="0;0.285;0.375;0.465;1" dur="9s" repeatCount="indefinite"/><text x="190" y="270" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12.5" fill="#ff4d5a">Class 8</text><circle cx="215" cy="266" r="5.5" fill="#0b0f17" stroke="#ff4d5a" stroke-width="2"/><text x="245" y="262" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Kali and tinkering</text><text x="245" y="281" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b98a9">Kali in VirtualBox, and learning by breaking things on a potato PC.</text></g><g opacity=".5"><animate attributeName="opacity" values=".5;.5;1;.5;.5" keyTimes="0;0.410;0.500;0.590;1" dur="9s" repeatCount="indefinite"/><text x="190" y="324" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12.5" fill="#ff4d5a">Sem 2</text><circle cx="215" cy="320" r="5.5" fill="#0b0f17" stroke="#ff4d5a" stroke-width="2"/><text x="245" y="316" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">1st place, CGIT Bilaspur</text><text x="245" y="335" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b98a9">Won the coding contest at the college cultural fest.</text></g><g opacity=".5"><animate attributeName="opacity" values=".5;.5;1;.5;.5" keyTimes="0;0.535;0.625;0.715;1" dur="9s" repeatCount="indefinite"/><text x="190" y="378" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12.5" fill="#ff4d5a">2026</text><circle cx="215" cy="374" r="5.5" fill="#0b0f17" stroke="#ff4d5a" stroke-width="2"/><text x="245" y="370" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">3rd place, Agrithon</text><text x="245" y="389" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b98a9">Prototype Demonstration with CropWise at CVRU i-TBI, Bilaspur.</text></g><g opacity=".5"><animate attributeName="opacity" values=".5;.5;1;.5;.5" keyTimes="0;0.660;0.750;0.840;1" dur="9s" repeatCount="indefinite"/><text x="190" y="432" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12.5" fill="#ff4d5a">2026</text><circle cx="215" cy="428" r="5.5" fill="#0b0f17" stroke="#ff4d5a" stroke-width="2"/><text x="245" y="424" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">SIH26106: TraceMail</text><text x="245" y="443" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b98a9">Built an email threat forensics platform for Smart India Hackathon.</text></g><g opacity=".5"><animate attributeName="opacity" values=".5;.5;1;.5;.5" keyTimes="0;0.785;0.875;0.965;1" dur="9s" repeatCount="indefinite"/><text x="190" y="486" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12.5" fill="#ff4d5a">Oct '26</text><circle cx="215" cy="482" r="5.5" fill="#0b0f17" stroke="#ff4d5a" stroke-width="2"/><text x="245" y="478" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">DataOps: TraceDoc</text><text x="245" y="497" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b98a9">Started a document forensics build with a team.</text></g><g opacity=".5"><animate attributeName="opacity" values=".5;.5;1;.5;.5" keyTimes="0;0.910;1.000;1.000;1" dur="9s" repeatCount="indefinite"/><text x="190" y="540" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12.5" fill="#ff4d5a">Now</text><circle cx="215" cy="536" r="5.5" fill="#0b0f17" stroke="#ff4d5a" stroke-width="2"/><text x="245" y="532" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Heist-Game</text><text x="245" y="551" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b98a9">Learning Unity by building a 3D co-op game, greybox first.</text></g><circle r="12" fill="#ff4d5a" opacity=".35" filter="url(#glow)"><animateMotion dur="9s" repeatCount="indefinite" path="M215 104 L215 536"/></circle><circle r="4.5" fill="#fff"><animateMotion dur="9s" repeatCount="indefinite" path="M215 104 L215 536"/></circle></svg>