<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Now building"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#151d2b"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="900" height="250" rx="16" fill="url(#bg)"/><rect x=".5" y=".5" width="899" height="249" rx="16" fill="none" stroke="#fff" stroke-opacity=".10"/><text x="30" y="46" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Now building</text><rect x="30" y="68" width="270" height="160" rx="14" fill="#fff" fill-opacity=".03"/><rect x="30.5" y="68.5" width="269" height="159" rx="14" fill="none" stroke="#ff4d5a" stroke-width="1.6" stroke-opacity=".18"><animate attributeName="stroke-opacity" values=".18;1;.18;.18" keyTimes="0;.1;.33;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect><text x="50" y="104" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">TraceDoc</text><rect x="189" y="88" width="91" height="22" rx="11" fill="#ff4d5a" fill-opacity=".14" stroke="#ff4d5a" stroke-opacity=".5"/><text x="235" y="103" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="10" font-weight="700" fill="#ff4d5a">IN PROGRESS</text><text x="50" y="136" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b98a9">Document forensics for the DataOps</text><text x="50" y="156" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b98a9">hackathon. OCR in, evidence out.</text><rect x="50" y="180" width="230" height="30" rx="8" fill="#000" fill-opacity=".35"/><text x="62" y="199" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12" fill="#ff4d5a">$ ocr scan --evidence